# News items shown on the /news/ page.
#
# To add an item, copy one of the blocks below to the top of this file and edit it.
# Ordering and the year headings are handled automatically from `date`.
#
#   date         Required. "YYYY-MM-DD". Used for sorting and for the displayed date.
#   date_display Optional. Overrides the displayed date, e.g. "2025" or "Spring 2026".
#   category     Optional. Short label, e.g. "Paper", "Award", "Talk", "Teaching".
#   title        Required. One line. Markdown (emphasis, links) is allowed.
#   summary      Optional. A sentence or two of context. Markdown is allowed.
#   links        Optional. Any number of [[item.links]] blocks with `name` and `url`.
#   draft        Optional. Set to true to hide an item without deleting it.

